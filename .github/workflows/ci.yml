name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Тестовые значения — НЕ боевые. Прод берёт эти переменные из окружения сервиса.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-secret-not-for-prod"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Apply migrations (ловит сломанные миграции)
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test -v2
