<!DOCTYPE html>
<html>
<head>
    <title>Упаковка</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f6f7fb; margin: 0; padding: 32px; color: #111827; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; border-radius: 18px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.07); }
        .nav a { margin-right: 12px; font-weight: bold; color: #111827; text-decoration: none; }
        .grid { display: grid; grid-template-columns: 2fr 1fr auto; gap: 14px; align-items: end; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        input { padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; }
        button { background: #111827; color: white; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #111827; color: white; padding: 14px; text-align: left; }
        td { padding: 14px; border-bottom: 1px solid #e5e7eb; }
        .price { color: #047857; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>Упаковка</h1>
        <div class="nav">
            <a href="/">Блюда</a>
            <a href="/products/">Продукты</a>
            <a href="/preparations/">Заготовки</a>
            <a href="/employees/">Сотрудники</a>
            <a href="/utilities/">Коммуналка</a>
        </div>
    </div>

    <div class="card">
        <h2>Добавить упаковку</h2>

        <form method="post">
            {% csrf_token %}
            <div class="grid">
                <div class="field">
                    <label>Название упаковки</label>
                    <input type="text" name="name" placeholder="Например: контейнер 500 мл">
                </div>

                <div class="field">
                    <label>Стоимость</label>
                    <input type="number" step="0.01" name="cost">
                </div>

                <button type="submit">Добавить</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Список упаковок</h2>

        <table>
            <tr>
                <th>Название</th>
                <th>Стоимость</th>
            </tr>

            {% for packaging in packagings %}
            <tr>
                <td><strong>{{ packaging.name }}</strong></td>
                <td class="price">{{ packaging.cost }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>

</body>
</html>
