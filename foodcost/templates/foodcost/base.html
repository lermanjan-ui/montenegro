<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}FoodCost{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            color: #111827;
        }

        .header {
            background: white;
            padding: 18px 32px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
        }

        .country {
            color: #047857;
            font-weight: bold;
            margin-left: 8px;
        }

        .nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #111827;
            font-weight: 600;
        }

        .nav a:hover {
            color: #047857;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
        }

        h1, h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">
        🍽 FoodCost
        {% if country %}
            <span class="country">/ {{ country.name }}</span>
        {% endif %}
    </div>

    <div class="nav">
        {% if country %}
            <a href="/c/{{ country.slug }}/">Блюда</a>
            <a href="/c/{{ country.slug }}/products/">Продукты</a>
            <a href="/c/{{ country.slug }}/preparations/">Заготовки</a>
            <a href="/c/{{ country.slug }}/employees/">Сотрудники</a>
            <a href="/c/{{ country.slug }}/packaging/">Упаковка</a>
            <a href="/c/{{ country.slug }}/utilities/">Коммуналка</a>
            <a href="/">Сменить страну</a>
        {% else %}
            <a href="/">Страны</a>
            <a href="/admin/">Админка</a>
        {% endif %}
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
