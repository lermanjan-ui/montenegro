{% extends "foodcost/base.html" %}
{% load i18n %}

{% block title %}{% trans "Вход" %}{% endblock %}

{% block content %}

<style>
    .login-card {
        max-width: 420px;
        margin: 80px auto;
    }

    label {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 6px;
        display: block;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 16px;
        box-sizing: border-box;
        margin-bottom: 16px;
    }

    button {
        width: 100%;
        background: #111827;
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
    }

    .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 16px;
        font-weight: bold;
    }
</style>

<div class="card login-card">
    <h1>{% trans "Вход в ЧекМейт" %}</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>{% trans "Логин" %}</label>
        <input name="username" placeholder="{% trans "Введите логин" %}">

        <label>{% trans "Пароль" %}</label>
        <input name="password" type="password" placeholder="{% trans "Введите пароль" %}">

        <button type="submit">{% trans "Войти" %}</button>
    </form>
</div>

{% endblock %}
