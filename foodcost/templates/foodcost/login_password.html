<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · FoodCost</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#F7F8FA;--text:#111827;--muted:#667085;--border:#E5E7EB;--primary:#123B7A;--primary-dark:#0D2D5F;--primary-soft:#E7EDF7;--danger:#E23B3B;--danger-soft:#FDECEC;}
*{box-sizing:border-box;}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);margin:0;color:var(--text);font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.wrap{width:100%;max-width:400px;}
.brand{font-size:20px;font-weight:700;margin-bottom:10px;}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;}
.card h1{font-size:20px;margin:0 0 6px;}
.card p.sub{color:var(--muted);margin:0 0 18px;}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px;}
input{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-family:inherit;font-size:14px;margin-bottom:14px;}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.btn{width:100%;height:46px;background:var(--primary);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:15px;margin-top:4px;}
.btn:hover{background:var(--primary-dark);}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600;}
.foot{text-align:center;color:var(--muted);margin-top:14px;font-size:13px;}
.foot a{color:var(--primary);text-decoration:none;font-weight:600;}
.row-forgot{text-align:right;margin:-6px 0 14px;}
.row-forgot a{color:var(--muted);text-decoration:none;font-size:12px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">FoodCost</div>
    <div class="card">
      <h1>Вход</h1>
      <p class="sub">E-mail, телефон или логин и пароль.</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <label>E-mail, телефон или логин</label>
        <input type="text" name="identifier" value="{{ form.identifier }}" required autofocus placeholder="you@mail.uz, +998.. или логин">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="Пароль">
        <div class="row-forgot"><a href="/login/forgot/">Забыли пароль?</a></div>
        <button class="btn" type="submit">Войти</button>
      </form>
    </div>
    <div class="foot">Нет аккаунта? <a href="/signup/">Создать аккаунт</a></div>
  </div>
</body>
</html>
