{% extends "foodcost/base.html" %}

{% block title %}Новый заказ{% endblock %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== FoodCost Design System 1.1 — Страница заказа ===== */
:root{
    --deep-blue:#123B7A; --deep-blue-dark:#0D2D5F;
    --black:#111827; --white:#FFFFFF; --bg:#F7F8FA;
    --border:#E5E7EB; --muted:#667085;
    --success:#1E9E52; --success-soft:#E7F6ED;
    --danger:#E23B3B;  --danger-soft:#FDECEC;
    --warning:#E08A00; --warning-soft:#FBF0DC;
    --blue-soft:#E7EDF7;
    --r-btn:8px; --r-card:10px;
}

.page{
    max-width:1600px;
    margin:0 auto;
    font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--black);
}
.page *{box-sizing:border-box;}

.topbar{
    margin-bottom:20px;
}

h1{
    margin:0;
    font-size:28px;
    line-height:34px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--black);
}

.muted{
    color:var(--muted);
    margin-top:6px;
    font-size:14px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:16px;
    align-items:start;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--r-card);
    padding:18px;
    margin-bottom:16px;
}

.section-title{
    font-size:18px;
    line-height:24px;
    font-weight:600;
    color:var(--black);
    margin-bottom:16px;
    letter-spacing:-0.01em;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.grid-3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
}

input,
select,
textarea{
    width:100%;
    height:40px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:var(--r-btn);
    box-sizing:border-box;
    font-size:14px;
    font-family:inherit;
    color:var(--black);
    background:#fff;
    transition:.15s;
}

textarea{
    height:auto;
    min-height:88px;
    padding:10px 12px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:var(--deep-blue);
    box-shadow:0 0 0 3px rgba(18,59,122,0.12);
}

.summary-card-sticky{
    position:sticky;
    top:16px;
}

.summary-box{
    display:grid;
    gap:14px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}

.summary-row:last-child{
    border-bottom:0;
}

.summary-label{
    color:var(--muted);
    font-weight:500;
    font-size:13px;
}

.summary-value{
    font-size:20px;
    font-weight:700;
    color:var(--black);
}

.summary-total{
    color:var(--deep-blue);
}

.save-btn{
    width:100%;
    background:var(--deep-blue);
    color:#fff;
    border:1px solid var(--deep-blue);
    border-radius:var(--r-btn);
    height:44px;
    padding:0 18px;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-top:18px;
    transition:.15s;
}

.save-btn:hover{
    background:var(--deep-blue-dark);
    border-color:var(--deep-blue-dark);
}

.add-dish-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 140px 160px;
    gap:12px;
    align-items:end;
    margin-bottom:18px;
}

#add-item-btn{
    height:40px;
    border:1px solid var(--deep-blue);
    border-radius:var(--r-btn);
    background:var(--deep-blue);
    color:#fff;
    font-weight:600;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    transition:.15s;
}

#add-item-btn:hover{
    background:var(--deep-blue-dark);
    border-color:var(--deep-blue-dark);
}

.order-items-table{
    border:1px solid var(--border);
    border-radius:var(--r-card);
    overflow:hidden;
}

.order-items-head{
    display:grid;
    grid-template-columns:1.5fr 140px 120px 140px 70px;
    gap:14px;
    padding:12px 16px;
    background:var(--bg);
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
}

.order-items-row{
    display:grid;
    grid-template-columns:1.5fr 140px 120px 140px 70px;
    gap:14px;
    align-items:center;
    padding:12px 16px;
    border-top:1px solid var(--border);
}

.item-name{
    font-weight:600;
    color:var(--black);
}

.item-price{
    font-weight:600;
    color:var(--black);
}

.quantity-input{
    text-align:center;
}

.item-total{
    font-weight:700;
    color:var(--black);
    text-align:center;
}

.remove-item-btn{
    width:40px;
    height:40px;
    border:1px solid var(--danger-soft);
    background:var(--danger-soft);
    color:var(--danger);
    border-radius:var(--r-btn);
    font-weight:600;
    cursor:pointer;
    font-size:18px;
    font-family:inherit;
    padding:0;
}

.remove-item-btn:hover{
    background:#FBDCDC;
}

#customer-info{
    line-height:1.6;
}

.dish-search-wrap {
    position: relative;
}

.dish-search-results {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: 0 16px 35px rgba(15,23,42,0.12);
    max-height: 260px;
    overflow-y: auto;
    z-index: 50;
}

.dish-search-result {
    padding: 11px 14px;
    cursor: pointer;
    font-weight: 500;
    color: var(--black);
    border-bottom: 1px solid var(--border);
}

.dish-search-result:hover {
    background: var(--bg);
}

.dish-search-price {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
}

@media (max-width:1200px){

    .layout{
        grid-template-columns:1fr;
    }

    .summary-card-sticky{
        position:relative;
        top:0;
    }

}

@media (max-width:900px){

    .grid-2,
    .grid-3,
    .add-dish-row{
        grid-template-columns:1fr;
    }

    .order-items-head{
        display:none;
    }

    .order-items-row{
        grid-template-columns:1fr;
        gap:12px;
    }

    h1{
        font-size:24px;
        line-height:30px;
    }

}

</style>
<div class="page">

    <div class="topbar">

        <h1>Новый заказ</h1>

        <div class="muted">
            Создание заказа кассиром
        </div>

    </div>

   <form method="post">

       {% csrf_token %}

       {% include "foodcost/includes/order_form.html" %}

   </form>
</div>

<script>
	function updateOrderTotals() {

	    let subtotal = 0;

	    document.querySelectorAll(".order-item").forEach(row => {

	        const customPriceInput = row.querySelector(".item-price-input");

	        const price = customPriceInput
	            ? parseFloat(customPriceInput.value) || 0
	            : parseFloat(row.querySelector(".dish-price").value) || 0;

	        const quantity = parseFloat(
	            row.querySelector(".quantity-input").value
	        ) || 0;

	        const total = price * quantity;

	        row.querySelector(".item-total").value =
	            total.toLocaleString("ru-RU", {
	                maximumFractionDigits: 0
	            });

	        subtotal += total;
	    });

	    const deliveryInput = document.querySelector(
	        'input[name="delivery_amount"]'
	    );

	    const delivery = parseFloat(
	        deliveryInput ? deliveryInput.value : 0
	    ) || 0;

	    const promoSelect = document.getElementById(
	        "promo-code-select"
	    );

	    let discountPercent = 0;

	    if (
	        promoSelect &&
	        promoSelect.selectedOptions.length
	    ) {
	        discountPercent = parseFloat(
	            promoSelect.selectedOptions[0].dataset.percent
	        ) || 0;
	    }

	    const discount = subtotal * discountPercent / 100;
	    const foodTotal = subtotal - discount;

	    let customerDelivery = 0;

	    const freeCustomerDeliveryCheckbox =
	        document.getElementById("free-customer-delivery");

	    const sourceSelect = document.querySelector(
	        'select[name="source_id"]'
	    );

	    const sourceName = sourceSelect
	        ? sourceSelect.options[sourceSelect.selectedIndex].text.toLowerCase()
	        : "";

	    if (
	        !freeCustomerDeliveryCheckbox?.checked &&
	        sourceName.includes("сайт") &&
	        foodTotal > 0 &&
	        foodTotal < 150000
	    ) {
	        customerDelivery = 15000;
	    }

	    const total = foodTotal + customerDelivery;

	    document.getElementById("summary-subtotal").innerText =
	        subtotal.toLocaleString("ru-RU", {
	            maximumFractionDigits: 0
	        });

	    document.getElementById("summary-discount").innerText =
	        discount.toLocaleString("ru-RU", {
	            maximumFractionDigits: 0
	        });

	    document.getElementById("summary-food-total").innerText =
	        foodTotal.toLocaleString("ru-RU", {
	            maximumFractionDigits: 0
	        });

	    document.getElementById("summary-customer-delivery").innerText =
	        customerDelivery.toLocaleString("ru-RU", {
	            maximumFractionDigits: 0
	        });

	    document.getElementById("summary-delivery").innerText =
	        delivery.toLocaleString("ru-RU", {
	            maximumFractionDigits: 0
	        });

	    document.getElementById("summary-total").innerText =
	        total.toLocaleString("ru-RU", {
	            maximumFractionDigits: 0
	        });
	}

function setupDishSearch() {
    const input = document.getElementById("add-dish-search");
    const results = document.getElementById("dish-search-results");
    const hiddenId = document.getElementById("add-dish-id");
    const hiddenPrice = document.getElementById("add-dish-price");

    if (!input || !results) return;

    function selectDish(item) {
        input.value = item.dataset.name;
        hiddenId.value = item.dataset.id;
        hiddenPrice.value = item.dataset.price;

        results.querySelectorAll(".dish-search-result").forEach(row => {
            row.classList.remove("selected");
        });

        item.classList.add("selected");
		results.style.display = "none";
    }

    function filterDishes() {
		const query = input.value.trim().toLowerCase();

		if (!query) {
		    results.style.display = "none";
		    return;
		}

		results.style.display = "block";

		results.querySelectorAll(".dish-search-result").forEach(item => {
            const name = item.dataset.name.toLowerCase();

            item.style.display = name.includes(query) ? "block" : "none";
        });

        hiddenId.value = "";
        hiddenPrice.value = "";
    }


    input.addEventListener("input", filterDishes);

    results.querySelectorAll(".dish-search-result").forEach(item => {
        item.addEventListener("click", function () {
            selectDish(item);
        });
    });
}
document.getElementById("add-item-btn").addEventListener("click", function () {
    const searchInput = document.getElementById("add-dish-search");
    const dishIdInput = document.getElementById("add-dish-id");
    const dishPriceInput = document.getElementById("add-dish-price");
    const quantityInput = document.getElementById("add-dish-quantity");

    const dishId = dishIdInput.value;
    const dishName = searchInput.value;
    const price = parseFloat(dishPriceInput.value) || 0;
    const quantity = parseFloat(quantityInput.value) || 1;

    if (!dishId || !dishName || !price) {
        alert("Выберите блюдо из списка");
        return;
    }

    const total = price * quantity;

    const row = document.createElement("div");
    row.className = "order-item order-items-row";

    row.innerHTML = `
        <input type="hidden" name="dish_id" value="${dishId}" class="dish-hidden">
        <input type="hidden" class="dish-price" value="${price}">

        <div class="item-name">${dishName}</div>
<input
    type="number"
    name="price"
    class="item-price-input"
    value="${price.toFixed(0)}"
    step="1"
>

        <input type="number" name="quantity" class="quantity-input" value="${quantity}" min="1" step="1">

        <input type="text" class="item-total" value="${total.toFixed(0)}" readonly>

        <button type="button" class="remove-item-btn">×</button>
    `;

    document.getElementById("order-items").appendChild(row);

    searchInput.value = "";
    dishIdInput.value = "";
    dishPriceInput.value = "";
    quantityInput.value = 1;

    updateOrderTotals();
});

document.addEventListener("input", function (e) {

    if (
        e.target.classList.contains("quantity-input") ||
        e.target.classList.contains("item-price-input")
    ) {
        updateOrderTotals();
    }

    if (e.target.name === "delivery_amount") {
        updateOrderTotals();
    }
});

document.addEventListener("change", function (e) {
    if (
        e.target.id === "promo-code-select" ||
        e.target.id === "free-customer-delivery" ||
        e.target.name === "promo_code_id" ||
        e.target.name === "source_id"
    ) {
        updateOrderTotals();
    }
});

document.addEventListener("click", function (e) {
    if (!e.target.classList.contains("remove-item-btn")) return;

    e.target.closest(".order-item").remove();
    updateOrderTotals();
});

function setupCustomerLookup() {
    const phoneInput = document.getElementById("customer-phone");
    const infoBox = document.getElementById("customer-info");

    if (!phoneInput || !infoBox) return;

    phoneInput.addEventListener("blur", async function () {
        const phone = phoneInput.value.trim();

        if (!phone) return;

        const response = await fetch(
            `/c/{{ country.slug }}/orders/customer-lookup/?phone=${encodeURIComponent(phone)}`
        );

        const data = await response.json();

        infoBox.style.display = "block";

        if (!data.found) {
            infoBox.innerHTML = "Новый клиент";
            return;
        }

        document.querySelector('input[name="customer_name"]').value = data.name || "";
        document.querySelector('input[name="customer_telegram"]').value = data.telegram || "";

        if (data.addresses && data.addresses.length > 0) {
            document.querySelector('textarea[name="delivery_address"]').value =
                data.addresses[0].address || "";
        }

		infoBox.innerHTML = `
		    Клиент найден
		`;

		const historyCard = document.getElementById(
		    "customer-history-card"
		);

		if (historyCard) {

		    historyCard.style.display = "block";

		    document.getElementById(
		        "customer-orders-count"
		    ).value = data.orders_count || 0;

		    document.getElementById(
		        "customer-last-order"
		    ).value = data.last_order_date || "—";

		    document.getElementById(
		        "customer-comment"
		    ).value = data.comment || "";
		}
		
		const openLink = document.getElementById(
		    "open-customer-link"
		);

		if (openLink && data.customer_id) {

		    openLink.href =
		        `/c/{{ country.slug }}/customers/${data.customer_id}/`;

		}
    });
	
}

function setupSourceAutomation() {
    const sourceSelect = document.getElementById("source-select");
    const paymentSelect = document.getElementById("payment-method-select");
    const deliverySelect = document.getElementById("delivery-provider-select");

    if (!sourceSelect || !paymentSelect || !deliverySelect) return;

    function updateSourceRules() {
        const option = sourceSelect.selectedOptions[0];

        const commission = parseFloat(
            option.dataset.commission || 0
        );

        const paymentId = option.dataset.payment || "";

        if (commission > 0) {
            deliverySelect.disabled = true;
            deliverySelect.value = "";

            if (paymentId) {
                paymentSelect.value = paymentId;
            }

            paymentSelect.disabled = true;
        } else {
            deliverySelect.disabled = false;
            paymentSelect.disabled = false;
        }

        updateOrderTotals();
    }

    sourceSelect.addEventListener("change", updateSourceRules);

    updateSourceRules();
}

setupCustomerLookup();
setupDishSearch();
setupSourceAutomation();
updateOrderTotals();
</script>

{% endblock %}
