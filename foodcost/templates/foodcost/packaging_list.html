{% extends "foodcost/base.html" %}

{% block title %}Упаковка{% endblock %}

{% block content %}

<style>
    .grid { display: grid; grid-template-columns: 2fr 1fr auto; gap: 14px; align-items: end; }
    input { padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 15px; }
    button { background: #111827; color: white; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #111827; color: white; padding: 14px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #e5e7eb; }
</style>

<div class="card">
    <h1>Упаковка</h1>
</div>

<div class="card">
    <h2>Добавить упаковку</h2>

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="create">

        <div class="grid">
            <input type="text" name="name" placeholder="Название упаковки">
            <input type="number" step="0.01" name="cost" placeholder="Стоимость">
            <button type="submit">Добавить</button>
        </div>
    </form>
</div>

<div class="card">
    <h2>Список упаковок</h2>

    <table>
        <tr>
            <th>Название</th>
            <th>Стоимость</th>
            <th>Действие</th>
        </tr>

        {% for packaging in packagings %}
        <tr>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="action" value="update">
                <input type="hidden" name="packaging_id" value="{{ packaging.id }}">

                <td>
                    <input type="text" name="name" value="{{ packaging.name }}">
                </td>

                <td>
                    <input type="number" step="0.01" name="cost" value="{{ packaging.cost }}">
                </td>

                <td>
                    <button type="submit">Сохранить</button>
                </td>
            </form>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
