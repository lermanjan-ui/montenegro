{% load i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% trans "Платформа · ЧекМейт" %}{% endblock %}</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --text:#111827; --muted:#667085; --border:#E5E7EB;
  --primary:#123B7A; --primary-dark:#0D2D5F; --primary-soft:#E7EDF7;
  --danger:#E23B3B; --danger-soft:#FDECEC;
  --ok:#157347; --ok-soft:#E6F4EC; --warn:#9A6700; --warn-soft:#FFF4D6;
}
*{box-sizing:border-box;}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);margin:0;color:var(--text);font-size:14px;line-height:20px;}
a{color:var(--primary);text-decoration:none;}
a:hover{text-decoration:underline;}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.01em;}
.brand .tag{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:999px;}
.topbar-actions{display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600;font-size:13px;}
.container{max-width:1500px;margin:auto;padding:22px 24px;}
h1{font-size:22px;margin:0 0 4px;}
h2{font-size:16px;margin:0 0 14px;}
.sub{color:var(--muted);margin:0 0 20px;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
.row{display:flex;gap:16px;flex-wrap:wrap;}
.btn{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:0 16px;height:40px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
.btn:hover{background:var(--primary-dark);text-decoration:none;}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--border);}
.btn.sec:hover{background:var(--bg);}
.btn.sm{height:32px;padding:0 12px;font-size:13px;}
.btn.danger{background:var(--danger-soft);color:var(--danger);}
.btn.danger:hover{background:#FBDCDC;}
input,select{height:40px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-family:inherit;font-size:14px;width:100%;background:#fff;}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px;}
.field{margin-bottom:14px;}
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;}
tr:last-child td{border-bottom:0;}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
.badge.ok{background:var(--ok-soft);color:var(--ok);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.off{background:var(--danger-soft);color:var(--danger);}
.badge.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.badge.plan{background:var(--primary-soft);color:var(--primary);}
.badge.addon{background:#F3E8FF;color:#7A3BB0;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{color:var(--muted);font-size:12px;font-weight:600;margin-top:2px;}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600;}
.muted{color:var(--muted);}
.inline{display:inline;}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">ЧекМейт <span class="tag">{% trans "Платформа" %}</span></div>
    <div class="topbar-actions">
      <a href="/platform/">{% trans "Клиенты" %}</a>
      {% if is_owner %}<a href="/platform/team/">{% trans "Команда" %}</a>{% endif %}
      <a href="/">{% trans "В ERP" %}</a>
    </div>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
