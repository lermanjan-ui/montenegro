{% extends "foodcost/base.html" %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<style>
.poswrap{--pw-ink:#111827;--pw-muted:#667085;--pw-border:#e5e7eb;--pw-surface:#fff;--pw-violet:#7a5af8;--pw-violet-soft:#efeafe;
  max-width:1000px;margin:0 auto;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--pw-ink);}
.poswrap .pw-h1{font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0 0 6px;}
.poswrap .pw-card{border:1px solid var(--pw-border);border-radius:12px;background:var(--pw-surface);padding:26px;text-align:center;color:var(--pw-muted);}
.poswrap .pw-badge{display:inline-block;font-size:11px;font-weight:700;color:var(--pw-violet);background:var(--pw-violet-soft);padding:3px 12px;border-radius:999px;margin-bottom:10px;}
</style>
<div class="poswrap">
  <div class="pw-h1">{{ title }}</div>
  <div class="pw-card">
    <div class="pw-badge">{% trans "в разработке" %}</div>
    <div>{% trans "Этот раздел «Настройки кассы» скоро появится." %}</div>
  </div>
</div>
{% endblock %}
